<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightspace Page Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   THEME — change these to match your Squarespace site
   ========================================================= */
:root{
  --bg:#f4f1ec;          /* page background            */
  --ink:#1d1d1b;         /* main text                  */
  --muted:#77736b;       /* secondary text             */
  --line:#d9d4cb;        /* hairlines                  */
  --accent:#c8102e;      /* counter / active markers   */
  --frame:#ffffff;       /* screenshot frame           */
  --shadow:0 18px 50px -18px rgba(30,25,15,.35), 0 2px 6px rgba(30,25,15,.08);
  --serif:"Instrument Serif", Georgia, serif;
  --sans:"Inter", system-ui, -apple-system, sans-serif;
  --turn-ms:800;         /* page-turn duration (also set in JS) */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto auto;gap:14px;padding:18px clamp(12px,3vw,32px) 16px}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.page-title{font-family:var(--serif);font-weight:400;font-size:clamp(22px,3vw,34px);line-height:1.05;margin-top:4px}
.counter{font-family:var(--serif);font-size:clamp(22px,3vw,34px);line-height:1;white-space:nowrap}
.counter b{font-weight:400;color:var(--accent)}
.counter span{color:var(--muted);font-size:.6em;margin:0 .25em}

/* ---------- stage row ---------- */
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto 44px;align-items:center;gap:clamp(8px,1.5vw,18px);min-height:0}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--frame);display:grid;place-items:center;transition:transform .2s,background .2s,opacity .2s;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav:hover:not(:disabled){transform:scale(1.07);background:var(--ink);color:var(--bg)}
.nav:disabled{opacity:.3;cursor:default}
.nav svg{width:18px;height:18px}

.stage{position:relative;height:100%;min-height:0;perspective:2400px;max-width:1040px;width:100%;justify-self:center}
.leaf{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--frame);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;transform-origin:left center;backface-visibility:hidden;visibility:hidden}
.leaf.on{visibility:visible}
.leaf .shade{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.35))}
.chrome{flex:none;display:flex;align-items:center;gap:10px;height:30px;padding:0 12px;border-bottom:1px solid #ebe8e2;background:#faf9f6}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:#dedad2}
.chrome .url{flex:1;min-width:0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;padding-right:40px}
.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#cfc9bf transparent;position:relative}
.scroller img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.scroller.overview{overflow:hidden;display:flex;justify-content:center;background:#efece6;cursor:zoom-in}
.scroller.overview img{width:auto;height:100%;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.missing{height:100%;min-height:200px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:24px;background:repeating-linear-gradient(45deg,#faf9f6 0 12px,#f3f1ec 12px 24px)}
.missing code{display:block;margin-top:6px;color:var(--ink)}
.progress{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0;transition:width .1s linear;z-index:2}
.scroll-hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(29,29,27,.82);color:#fff;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:20px;pointer-events:none;transition:opacity .5s;display:flex;gap:6px;align-items:center;z-index:3}
.scroll-hint.hide{opacity:0}

/* ---------- minimap ---------- */
.mini{position:relative;align-self:center;cursor:pointer;border-radius:3px;box-shadow:0 2px 10px rgba(0,0,0,.12);background:var(--frame);touch-action:none}
.mini img{display:block;width:100%;height:100%;object-fit:fill;opacity:.85;border-radius:3px}
.lens{position:absolute;left:-3px;right:-3px;top:0;border:2px solid var(--accent);border-radius:3px;background:rgba(200,16,46,.07);cursor:grab}
.lens:active{cursor:grabbing}
.mini-label{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}

/* ---------- caption + tools ---------- */
.caption{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;max-width:1040px;width:100%;justify-self:center;padding:0 2px}
.cap-text{min-width:0}
.chip{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--ink);border-radius:20px;padding:3px 9px;margin-right:8px;vertical-align:2px}
.cap-title{font-family:var(--serif);font-size:20px;line-height:1.15}
.cap-desc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:4px;max-width:70ch}
.tools{display:flex;gap:6px;flex:none}
.tool{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--frame);border-radius:20px;padding:7px 12px;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:background .2s,color .2s}
.tool:hover,.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tool svg{width:13px;height:13px}

/* ---------- thumbnails ---------- */
.thumbs{display:flex;gap:10px;justify-content:center;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:none;width:92px;height:58px;border-radius:4px;overflow:hidden;position:relative;background:var(--frame);border:1px solid var(--line);opacity:.55;transition:opacity .25s,transform .25s,border-color .25s}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:center 14%;display:block;transform:scale(1.5);transform-origin:center 14%}
.thumb:hover{opacity:.9;transform:translateY(-2px)}
.thumb[aria-current="true"]{opacity:1;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.thumb .n{position:absolute;left:4px;bottom:3px;font-size:10px;font-weight:600;background:rgba(255,255,255,.92);border-radius:3px;padding:0 4px}

/* ---------- small screens ---------- */
@media (max-width:760px){
  .app{gap:10px;padding:12px 10px}
  .row{grid-template-columns:minmax(0,1fr)}
  .mini{display:none}
  .nav{position:absolute;top:50%;z-index:20;width:38px;height:38px;transform:translateY(-50%)}
  .nav:hover:not(:disabled){transform:translateY(-50%)}
  .nav.prev{left:4px}.nav.next{right:4px}
  .row{position:relative}
  .caption{flex-direction:column;gap:8px}
  .cap-desc{display:none}
  .thumb{width:64px;height:42px}
}
@media (max-height:600px){ .thumbs{display:none} .cap-desc{display:none} }
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<!-- =========================================================
     YOUR PAGES — edit this list. Put images in /images.
     Tip: export screenshots ~1600px wide as JPG (quality ~80).
     ========================================================= -->
<script>
const VIEWER = {
  eyebrow: "Selected Work · Brightspace Course Pages",
  title:   "Interactive Course Design",
  startAt: 1,          // which page to open first (1-based)
  pages: [
    {
      src:    "images/page-01.jpg",
      course: "FSH 850",
      title:  "Primary Research: Consumer Observation",
      desc:   "Long-form research page with an icon-led methods table, numbered step-by-step process and an observation vs. interpretation comparison."
    },
    {
      src:    "images/page-02.jpg",
      course: "FSH 109",
      title:  "Types of Material: Fabrics",
      desc:   "Accordion of fabric categories with embedded image sliders, followed by a custom matching activity for woven, knit and nonwoven properties."
    },
    {
      src:    "images/page-03.jpg",
      course: "FSH 109",
      title:  "From Inspiration to Collection",
      desc:   "Module 6 page pairing an inspiration-board image slider with a Bauhaus-themed drag-and-drop sort: does each design choice fit the inspiration?"
    },
    {
      src:    "images/page-04.jpg",
      course: "GR 750",
      title:  "Making It Legible: Direction, Experience, and Proof",
      desc:   "Thesis-stage page with a custom illustration and a numbered tab interface that walks students through the three things their work must communicate."
    },
    {
      src:    "images/page-05.jpg",
      course: "PH 108",
      title:  "Natural Light: Time of Day",
      desc:   "Photography case study built around interactive hotspot images comparing the same scene at 7:45 a.m., 2:00 p.m. and 9:00 p.m., with detail crops."
    }
  ]
};
</script>

<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="page-title" id="mainTitle"></h1>
    </div>
    <div class="counter" aria-hidden="true"><b id="cNow">01</b><span>/</span><em id="cAll" style="font-style:normal">01</em></div>
  </header>

  <div class="row">
    <button class="nav prev" id="prev" aria-label="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="stage" id="stage" aria-roledescription="carousel"></div>
    <div class="mini" id="mini" title="Click or drag to jump through the page">
      <img id="miniImg" alt="">
      <div class="lens" id="lens"></div>
      <div class="mini-label">Full page</div>
    </div>
    <button class="nav next" id="next" aria-label="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div class="caption">
    <div class="cap-text">
      <div class="cap-title"><span class="chip" id="capCourse"></span><span id="capTitle"></span></div>
      <p class="cap-desc" id="capDesc"></p>
    </div>
    <div class="tools">
      <button class="tool" id="fitBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></svg>
        <span>Whole page</span>
      </button>
      <button class="tool" id="openBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
        <span>Full size</span>
      </button>
    </div>
  </div>

  <nav class="thumbs" id="thumbs" aria-label="Pages"></nav>
  <div class="sr" aria-live="polite" id="live"></div>
</div>

<script>
(() => {
  const P = VIEWER.pages, N = P.length;
  const TURN = 800;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const stage = $('stage'), mini = $('mini'), miniImg = $('miniImg'), lens = $('lens');
  const pad = n => String(n).padStart(2, '0');
  let cur = Math.min(Math.max((VIEWER.startAt || 1) - 1, 0), N - 1);
  let busy = false, overview = false, hintShown = false;

  $('eyebrow').textContent = VIEWER.eyebrow || '';
  $('mainTitle').textContent = VIEWER.title || '';
  $('cAll').textContent = pad(N);

  // ---- build leaves ----
  const leaves = P.map((p, i) => {
    const leaf = document.createElement('section');
    leaf.className = 'leaf';
    leaf.setAttribute('aria-label', `Page ${i + 1} of ${N}: ${p.title}`);
    leaf.innerHTML = `
      <div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url"></div></div>
      <div class="scroller" tabindex="0"></div>
      <div class="progress"></div>
      <div class="shade"></div>`;
    leaf.querySelector('.url').textContent = [p.course, p.title].filter(Boolean).join('  ·  ');
    const sc = leaf.querySelector('.scroller');
    const img = new Image();
    img.alt = `Screenshot: ${p.title}${p.course ? ' (' + p.course + ')' : ''}`;
    img.decoding = 'async';
    img.dataset.src = p.src;
    img.onerror = () => {
      sc.innerHTML = `<div class="missing"><div>Image not found<code>${p.src}</code></div></div>`;
      leaf.dataset.missing = '1';
      if (i === cur) syncMini();
    };
    img.onload = () => { if (i === cur) syncMini(); };
    sc.appendChild(img);
    sc.addEventListener('scroll', () => { if (i === cur) { syncLens(); hideHint(); } }, { passive: true });
    sc.addEventListener('click', e => {
      if (!overview) return;
      const r = img.getBoundingClientRect();
      const frac = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1);
      setOverview(false);
      sc.scrollTop = frac * sc.scrollHeight - sc.clientHeight / 2;
    });
    stage.appendChild(leaf);
    return { leaf, sc, img, prog: leaf.querySelector('.progress'), shade: leaf.querySelector('.shade') };
  });

  const hint = document.createElement('div');
  hint.className = 'scroll-hint';
  hint.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12l7 7 7-7"/></svg> Scroll to explore the page';
  stage.appendChild(hint);
  function hideHint(){ if (!hintShown) { hintShown = true; hint.classList.add('hide'); } }
  setTimeout(hideHint, 6000);

  function load(i){ const L = leaves[i]; if (L && !L.img.src) L.img.src = L.img.dataset.src; }

  // ---- thumbnails ----
  const thumbs = P.map((p, i) => {
    const b = document.createElement('button');
    b.className = 'thumb';
    b.setAttribute('aria-label', `Go to page ${i + 1}: ${p.title}`);
    b.innerHTML = `<img alt="" loading="lazy"><span class="n">${pad(i + 1)}</span>`;
    b.querySelector('img').src = p.src;
    b.querySelector('img').onerror = function(){ this.remove(); };
    b.onclick = () => go(i);
    $('thumbs').appendChild(b);
    return b;
  });
  if (N < 2) { $('thumbs').style.display = 'none'; }

  // ---- UI state ----
  function paint(){
    const p = P[cur];
    $('cNow').textContent = pad(cur + 1);
    $('capCourse').textContent = p.course || '';
    $('capCourse').style.display = p.course ? '' : 'none';
    $('capTitle').textContent = p.title || '';
    $('capDesc').textContent = p.desc || '';
    $('prev').disabled = cur === 0;
    $('next').disabled = cur === N - 1;
    thumbs.forEach((t, i) => t.setAttribute('aria-current', i === cur));
    thumbs[cur].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    $('live').textContent = `Page ${cur + 1} of ${N}: ${p.title}`;
    load(cur); load(cur + 1); load(cur - 1);
    syncMini();
  }

  // ---- minimap ----
  function syncMini(){
    const L = leaves[cur];
    const ok = L.img.naturalWidth && !L.leaf.dataset.missing;
    if (!ok || overview || innerWidth <= 760) { mini.style.visibility = 'hidden'; mini.style.width = '0px'; mini.style.height='0px'; return; }
    mini.style.visibility = '';
    const ratio = L.img.naturalWidth / L.img.naturalHeight;
    const maxH = stage.clientHeight - 24, maxW = 96;
    let h = maxH, w = h * ratio;
    if (w > maxW) { w = maxW; h = w / ratio; }
    mini.style.width = w + 'px'; mini.style.height = h + 'px';
    if (miniImg.getAttribute('src') !== L.img.src) miniImg.src = L.img.src;
    syncLens();
  }
  function syncLens(){
    const sc = leaves[cur].sc, L = leaves[cur];
    const max = sc.scrollHeight - sc.clientHeight;
    L.prog.style.width = (max > 0 ? sc.scrollTop / max * 100 : 0) + '%';
    if (!sc.scrollHeight) return;
    const mh = mini.clientHeight;
    lens.style.height = Math.max(10, sc.clientHeight / sc.scrollHeight * mh) + 'px';
    lens.style.top = (sc.scrollTop / sc.scrollHeight * mh) + 'px';
  }
  let dragging = false, dragOff = 0;
  function miniTo(clientY, center){
    const sc = leaves[cur].sc, r = mini.getBoundingClientRect();
    const lensH = lens.offsetHeight;
    const y = clientY - r.top - (center ? lensH / 2 : dragOff);
    sc.scrollTop = y / r.height * sc.scrollHeight;
  }
  mini.addEventListener('pointerdown', e => {
    dragging = true; mini.setPointerCapture(e.pointerId);
    if (e.target === lens) { dragOff = e.clientY - lens.getBoundingClientRect().top; }
    else { miniTo(e.clientY, true); dragOff = lens.offsetHeight / 2; }
    hideHint();
  });
  mini.addEventListener('pointermove', e => { if (dragging) miniTo(e.clientY, false); });
  mini.addEventListener('pointerup', () => dragging = false);

  // ---- overview (whole page) ----
  function setOverview(on){
    overview = on;
    leaves.forEach(L => L.sc.classList.toggle('overview', on));
    $('fitBtn').setAttribute('aria-pressed', on);
    $('fitBtn').querySelector('span').textContent = on ? 'Read page' : 'Whole page';
    syncMini();
  }
  $('fitBtn').onclick = () => { setOverview(!overview); hideHint(); };
  $('openBtn').onclick = () => window.open(P[cur].src, '_blank', 'noopener');

  // ---- page turn ----
  function go(to){
    if (busy || to === cur || to < 0 || to >= N) return;
    const from = cur, fwd = to > from;
    const A = leaves[from], B = leaves[to];
    cur = to; load(to);
    B.sc.scrollTop = 0;
    paint();
    if (reduce) {
      A.leaf.classList.remove('on'); B.leaf.classList.add('on');
      B.leaf.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250 });
      return;
    }
    busy = true;
    B.leaf.classList.add('on');
    const ease = 'cubic-bezier(.55,.06,.28,1)';
    let mover, under;
    if (fwd) {           // current page lifts away to the left
      mover = A; under = B;
      A.leaf.style.zIndex = 3; B.leaf.style.zIndex = 2;
      A.leaf.animate([
        { transform: 'rotateY(0deg)', boxShadow: '0 18px 50px -18px rgba(0,0,0,.35)' },
        { transform: 'rotateY(-35deg) translateZ(30px)', offset: .35, boxShadow: '30px 30px 60px -10px rgba(0,0,0,.35)' },
        { transform: 'rotateY(-100deg)', boxShadow: '60px 30px 60px -10px rgba(0,0,0,0)' }
      ], { duration: TURN, easing: ease, fill: 'forwards' });
      A.shade.animate([{ opacity: 0 }, { opacity: 1 }], { duration: TURN, easing: ease, fill: 'forwards' });
      B.shade.animate([{ opacity: .9 }, { opacity: 0 }], { duration: TURN, easing: 'ease-out', fill: 'forwards' });
    } else {             // previous page swings back in from the left
      mover = B; under = A;
      B.leaf.style.zIndex = 3; A.leaf.style.zIndex = 2;
      B.leaf.animate([
        { transform: 'rotateY(-100deg)' },
        { transform: 'rotateY(-35deg) translateZ(30px)', offset: .65 },
        { transform: 'rotateY(0deg)' }
      ], { duration: TURN, easing: ease, fill: 'forwards' });
      B.shade.animate([{ opacity: 1 }, { opacity: 0 }], { duration: TURN, easing: ease, fill: 'forwards' });
      A.shade.animate([{ opacity: 0 }, { opacity: .9 }], { duration: TURN, easing: 'ease-in', fill: 'forwards' });
    }
    setTimeout(() => {
      A.leaf.classList.remove('on');
      [A, B].forEach(L => {
        L.leaf.getAnimations().forEach(a => a.cancel());
        L.shade.getAnimations().forEach(a => a.cancel());
        L.leaf.style.zIndex = '';
      });
      busy = false;
    }, TURN + 20);
  }
  $('prev').onclick = () => go(cur - 1);
  $('next').onclick = () => go(cur + 1);

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' && e.shiftKey) { go(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { go(cur - 1); e.preventDefault(); }
    else if (e.key === 'Home' && e.shiftKey) go(0);
    else if (e.key === 'End' && e.shiftKey) go(N - 1);
    else if (e.key.toLowerCase() === 'f' && !e.metaKey && !e.ctrlKey) setOverview(!overview);
  });

  // horizontal swipe to turn (vertical swipes still scroll the page)
  let sx = 0, sy = 0, st = 0;
  stage.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
  stage.addEventListener('touchend', e => {
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - st < 700) go(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });

  addEventListener('resize', syncMini);

  leaves[cur].leaf.classList.add('on');
  paint();
})();
</script>
</body>
</html>
