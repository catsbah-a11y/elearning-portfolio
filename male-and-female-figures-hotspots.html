<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Male and Female Figures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1AA2D1; --blue-dark:#127FA6; --slate:#32323c; --ink:#2b2b33;
    --muted:#6b6b76; --line:#e3e3e8; --paper:#ffffff; --tint:#f5f6f8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper)}
  body{font-family:"Roboto",Arial,sans-serif;font-size:1.12em;line-height:150%;letter-spacing:.5px;color:var(--ink)}
  .wrap{max-width:1000px;margin:0 auto;padding:4px 0 8px}

  /* toolbar */
  .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
  .filters{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--tint)}
  .filters button{font:inherit;font-size:.78em;letter-spacing:.5px;border:0;background:transparent;color:var(--muted);
    padding:5px 14px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
  .filters button[aria-pressed="true"]{background:var(--slate);color:#fff}
  .filters button:hover:not([aria-pressed="true"]){color:var(--ink)}
  .progress{font-size:.78em;color:var(--muted);display:flex;align-items:center;gap:10px}
  .meter{width:90px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
  .meter span{display:block;height:100%;width:0;background:var(--blue);transition:width .35s ease}

  /* stage */
  .stage{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
  .stage img{display:block;width:100%;height:auto;user-select:none}
  .hs{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;
    border:2px solid #fff;background:var(--slate);color:#fff;cursor:pointer;padding:0;
    box-shadow:0 2px 6px rgba(0,0,0,.28);display:grid;place-items:center;
    transition:transform .2s ease,background .2s ease,opacity .25s ease}
  .hs svg{width:14px;height:14px;transition:transform .25s ease}
  .hs::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--blue);opacity:0;
    animation:pulse 2.4s ease-out infinite}
  .hs.visited{background:#fff;color:var(--slate);border-color:var(--slate)}
  .hs.visited::before,.stage.touched .hs::before{animation:none;opacity:0}
  .hs:hover{transform:translate(-50%,-50%) scale(1.12)}
  .hs.active{background:var(--blue);color:#fff;border-color:#fff;transform:translate(-50%,-50%) scale(1.18);z-index:2}
  .hs.active svg{transform:rotate(45deg)}
  .hs:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
  .hs.dim{opacity:.18;pointer-events:none}
  @keyframes pulse{0%{transform:scale(.8);opacity:.7}70%{transform:scale(1.35);opacity:0}100%{opacity:0}}

  /* detail panel */
  .panel{margin-top:14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);overflow:hidden}
  .intro{padding:18px 22px;color:var(--muted);font-size:.9em;display:flex;gap:14px;align-items:center}
  .intro .dot{flex:none;width:26px;height:26px;border-radius:50%;background:var(--slate);color:#fff;display:grid;place-items:center}
  .intro .dot svg{width:12px;height:12px}
  .detail{display:grid;grid-template-columns:minmax(0,42%) 1fr;align-items:stretch}
  .detail[hidden],.intro[hidden]{display:none}
  .figwrap{background:var(--tint);display:flex;align-items:center;justify-content:center;padding:14px;border-right:1px solid var(--line)}
  .figwrap img{display:block;max-width:100%;max-height:400px;height:auto;border-radius:3px}
  .copy{padding:20px 22px 16px;display:flex;flex-direction:column}
  .eyebrow{font-size:.7em;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue-dark);margin:0 0 4px}
  .copy h2{font-size:1.15em;line-height:1.3;margin:0 0 10px;color:var(--slate);font-weight:700;letter-spacing:.3px}
  .copy p{margin:0 0 14px}
  .compare{align-self:flex-start;font:inherit;font-size:.8em;color:var(--blue-dark);background:none;border:0;padding:0;
    cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-bottom:14px}
  .compare:hover{color:var(--slate)}
  .compare:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:2px}
  .nav{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
  .nav .count{font-size:.75em;color:var(--muted)}
  .nav button{font:inherit;font-size:.78em;letter-spacing:.5px;border:1px solid var(--line);background:#fff;color:var(--slate);
    border-radius:4px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .2s,background .2s}
  .nav button:hover{border-color:var(--slate)}
  .nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .nav svg{width:12px;height:12px}
  .done{display:none;padding:10px 22px;background:#eaf6fb;color:var(--blue-dark);font-size:.82em;border-top:1px solid #cfe9f3}
  .done.show{display:block}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:560px){
    .detail{grid-template-columns:1fr}
    .figwrap{border-right:0;border-bottom:1px solid var(--line)}
    .hs{width:24px;height:24px}
    .hs svg{width:11px;height:11px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

(function(){
  const stage=document.getElementById('stage'), intro=document.getElementById('intro'), detail=document.getElementById('detail');
  const dImg=document.getElementById('dImg'), dEyebrow=document.getElementById('dEyebrow'), dTitle=document.getElementById('dTitle'),
        dText=document.getElementById('dText'), dCount=document.getElementById('dCount'), dCompare=document.getElementById('dCompare');
  const prog=document.getElementById('progText'), meter=document.getElementById('meter'), done=document.getElementById('done');
  const plus='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  const visited=new Set(); let current=-1, filter='all';

  const btns=HOTSPOTS.map((h,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='hs'; b.innerHTML=plus;
    b.style.left=h.x+'%'; b.style.top=h.y+'%';
    b.setAttribute('aria-label',h.header); b.setAttribute('aria-controls','detail'); b.setAttribute('aria-expanded','false');
    b.addEventListener('click',()=> current===i ? close() : open(i,false));
    stage.appendChild(b); return b;
  });

  const list=()=>HOTSPOTS.map((h,i)=>i).filter(i=>filter==='all'||HOTSPOTS[i].figure===filter);

  function open(i,focusTitle){
    current=i; const h=HOTSPOTS[i];
    stage.classList.add('touched');
    btns.forEach((b,j)=>{b.classList.toggle('active',j===i);b.setAttribute('aria-expanded',j===i?'true':'false');});
    visited.add(i); btns[i].classList.add('visited');
    dImg.src=h.img; dImg.alt=h.alt;
    dEyebrow.textContent=h.figure==='female'?'Female Figure':'Male Figure';
    dTitle.textContent=h.header; dText.textContent=h.text;
    const pair=HOTSPOTS.findIndex((o,j)=>j!==i&&o.pair===h.pair);
    if(pair>-1){dCompare.hidden=false;dCompare.textContent='Compare with the '+(HOTSPOTS[pair].figure)+' figure →';dCompare.onclick=()=>{if(filter!=='all')setFilter('all');open(pair,true);};}
    else dCompare.hidden=true;
    const l=list(), pos=l.indexOf(i);
    dCount.textContent=(pos+1)+' of '+l.length;
    intro.hidden=true; detail.hidden=false;
    updateProgress();
    if(focusTitle) dTitle.focus({preventScroll:true});
    resize();
  }
  function close(){
    current=-1; btns.forEach(b=>{b.classList.remove('active');b.setAttribute('aria-expanded','false');});
    detail.hidden=true; intro.hidden=false; resize();
  }
  function step(d){
    const l=list(); let pos=l.indexOf(current); pos=(pos+d+l.length)%l.length; open(l[pos],true);
  }
  function updateProgress(){
    const n=visited.size; prog.textContent=n+' of '+HOTSPOTS.length+' explored';
    meter.style.width=(n/HOTSPOTS.length*100)+'%';
    done.classList.toggle('show',n===HOTSPOTS.length);
  }
  function setFilter(f){
    filter=f;
    document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter===f?'true':'false'));
    btns.forEach((b,i)=>{const show=f==='all'||HOTSPOTS[i].figure===f;b.classList.toggle('dim',!show);b.tabIndex=show?0:-1;b.setAttribute('aria-hidden',show?'false':'true');});
    if(current>-1 && !list().includes(current)) open(list()[0],false);
    else if(current>-1) open(current,false);
  }
  document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>setFilter(b.dataset.filter)));
  document.getElementById('prev').addEventListener('click',()=>step(-1));
  document.getElementById('next').addEventListener('click',()=>step(1));
  document.addEventListener('keydown',e=>{
    if(current<0) return;
    if(e.key==='Escape'){const b=btns[current];close();b.focus();}
    if(e.target.closest('.filters')) return;
    if(e.key==='ArrowRight'&&e.target.closest('.detail,.stage')){e.preventDefault();step(1);}
    if(e.key==='ArrowLeft'&&e.target.closest('.detail,.stage')){e.preventDefault();step(-1);}
  });

  /* auto-height for Brightspace iframes */
  function resize(){
    const h=document.documentElement.scrollHeight;
    try{ if(window.parentIFrame) window.parentIFrame.size(); }catch(e){}
    try{ window.parent.postMessage({type:'aau-resize',height:h},'*'); }catch(e){}
    try{ if(window.frameElement) window.frameElement.style.height=h+'px'; }catch(e){}
  }
  window.addEventListener('load',resize); window.addEventListener('resize',resize);
  dImg.addEventListener('load',resize);
})();
</script>
