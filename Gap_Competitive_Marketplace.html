  .brand .dot{transition:transform .2s ease;transform-box:fill-box;transform-origin:center;}
  .brand:focus-visible .dot,.brand:focus-visible polygon{stroke:#1580a5;stroke-width:3;}
  svg.dim .brand{opacity:0.18;}
  svg.dim .brand.on,svg.dim .brand.gap{opacity:1;}
  .brand.on .dot{transform:scale(1.5);stroke:#111;stroke-width:1.2;}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:0.6rem 1rem;margin:0.6rem 0.25rem 0;}
  .readout{flex:1 1 260px;min-height:2.9em;background:#f2f5f9;border-left:5px solid #006fbf;border-radius:4px;padding:0.55em 0.9em;font-size:1rem;line-height:1.4;}

  .toggle:focus-visible{outline:3px solid #1580a5;outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){.map *{transition:none !important;}}
</style>

<script>
(function(){
  var svg=document.querySelector('svg'), out=document.getElementById('readout'), tg=document.getElementById('toggle');
  var brands=[].slice.call(document.querySelectorAll('.brand')), locked=null, dflt=out.innerHTML;
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function clear(){brands.forEach(function(b){b.classList.remove('on');}); svg.classList.remove('dim');}
  function show(b){
    tg.setAttribute('aria-pressed','false'); clear();
    b.classList.add('on'); svg.classList.add('dim');
    out.innerHTML='<strong>'+esc(b.getAttribute('data-name'))+'</strong>: '+esc(b.getAttribute('data-where'));
  }
  function reset(){ if(locked) return; clear(); out.innerHTML=dflt; }
  brands.forEach(function(b){
    b.addEventListener('mouseenter',function(){ if(!locked) show(b); });
    b.addEventListener('mouseleave',reset);
    b.addEventListener('focus',function(){ show(b); });
    b.addEventListener('blur',function(){ if(locked===b) locked=null; reset(); });
    b.addEventListener('click',function(e){ e.stopPropagation(); if(locked===b){ locked=null; reset(); } else { locked=b; show(b); } });
    b.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); b.click(); } });
  });
  document.addEventListener('click',function(){ if(locked){ locked=null; reset(); } });
  tg.addEventListener('click',function(e){
    e.stopPropagation(); locked=null;
    var on=tg.getAttribute('aria-pressed')!=='true'; clear();
    if(on){
      var s=document.querySelectorAll('.brand.struggling'), names=[];
      [].forEach.call(s,function(b){ b.classList.add('on'); names.push(b.getAttribute('data-name')); });
      svg.classList.add('dim');
      out.innerHTML='<strong>Struggling:</strong> '+esc(names.join(', '));
    } else out.innerHTML=dflt;
    tg.setAttribute('aria-pressed',on?'true':'false');
  });
})();
(function(){
  function measure(){ return Math.ceil(document.body.getBoundingClientRect().height) + 2; }
  var last=0;
  function push(){ var px=measure(); if(px===last) return; last=px;
    try{ if(window.frameElement){ window.frameElement.style.height=px+'px'; window.frameElement.setAttribute('scrolling','no'); } }catch(e){}
    if(window.parent!==window) window.parent.postMessage({artuHeight:px},'*'); }
  if(window.ResizeObserver){ new ResizeObserver(push).observe(document.body); }
  window.addEventListener('load',push); window.addEventListener('resize',push);
  [0,150,400,1200].forEach(function(t){ setTimeout(push,t); });
})();
</script>
